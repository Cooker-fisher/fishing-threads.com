<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>電動リール 番手帯チャート</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; font-size: 13px; padding: 24px; background: #f5f7fa; color: #333; }
h2 { font-size: 14px; font-weight: 600; margin-bottom: 20px; color: #444; }
.chart { max-width: 740px; }

/* ブランド行 */
.brand-row {
  display: flex;
  align-items: center;
  margin-bottom: 5px;
}
.brand-label {
  width: 110px;
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 700;
  text-align: right;
  padding-right: 10px;
  color: #555;
  line-height: 1.4;
}
.track-wrap {
  position: relative;
  flex: 1;
  height: 28px;
}
.track-bg {
  position: absolute;
  inset: 3px 0;
  border-radius: 5px;
  background: #dde2ea;
}
.seg-fill {
  position: absolute;
  top: 3px;
  height: calc(100% - 6px);
}
.seg-daiwa          { background: #4a90d9; }
.seg-shimano-3digit { background: #e07840; }
.seg-shimano-4digit { background: #9b59b6; }
.tick-label {
  position: absolute;
  top: 0; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
  pointer-events: none;
  white-space: nowrap;
}

.section-gap { height: 20px; }

/* 魚種行 */
.fish-row {
  display: flex;
  align-items: stretch;
  margin-bottom: 5px;
}
.fish-label {
  width: 110px;
  flex-shrink: 0;
  font-size: 12px;
  text-align: right;
  padding-right: 10px;
  color: #444;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: flex-end;
}
.fish-tracks {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 2px 0;
}
.fish-track {
  position: relative;
  height: 13px;
}
.fish-bar {
  position: absolute;
  top: 0; height: 100%;
  border-radius: 3px;
  opacity: 0.85;
}
.fish-bar-daiwa          { background: #4a90d9; }
.fish-bar-shimano-3digit { background: #e07840; }
.fish-bar-shimano-4digit { background: #9b59b6; }
</style>
</head>
<body>
<h2>電動リール 番手帯チャート</h2>
<div class="chart" id="chart"></div>
<script>
const RANGES = {"ヒラメ": {"daiwa": {"start": 100, "end": 500, "axis": "3digit"}, "shimano_3digit": {"start": 200, "end": 600, "axis": "3digit"}}, "マダイ": {"daiwa": {"start": 100, "end": 500, "axis": "3digit"}, "shimano_3digit": {"start": 200, "end": 600, "axis": "3digit"}, "shimano_4digit": {"start": 1000, "end": 3000, "axis": "4digit"}}, "アジ": {"daiwa": {"start": 100, "end": 600, "axis": "3digit"}, "shimano_3digit": {"start": 200, "end": 600, "axis": "3digit"}, "shimano_4digit": {"start": 1000, "end": 3000, "axis": "4digit"}}, "イサキ": {"daiwa": {"start": 100, "end": 500, "axis": "3digit"}, "shimano_3digit": {"start": 200, "end": 600, "axis": "3digit"}}, "タチウオ": {"daiwa": {"start": 100, "end": 500, "axis": "3digit"}, "shimano_3digit": {"start": 200, "end": 600, "axis": "3digit"}, "shimano_4digit": {"start": 1000, "end": 3000, "axis": "4digit"}}, "イカ": {"daiwa": {"start": 100, "end": 600, "axis": "3digit"}, "shimano_3digit": {"start": 200, "end": 600, "axis": "3digit"}, "shimano_4digit": {"start": 1000, "end": 4000, "axis": "4digit"}}, "ハタ": {"daiwa": {"start": 200, "end": 500, "axis": "3digit"}, "shimano_3digit": {"start": 200, "end": 600, "axis": "3digit"}, "shimano_4digit": {"start": 1000, "end": 6000, "axis": "4digit"}}, "カレイ": {"daiwa": {"start": 200, "end": 200, "axis": "3digit"}}, "マグロ": {"daiwa": {"start": 300, "end": 600, "axis": "3digit"}, "shimano_4digit": {"start": 2000, "end": 6000, "axis": "4digit"}}, "ブリ": {"daiwa": {"start": 300, "end": 500, "axis": "3digit"}, "shimano_4digit": {"start": 2000, "end": 4000, "axis": "4digit"}}, "ヒラマサ": {"daiwa": {"start": 300, "end": 500, "axis": "3digit"}, "shimano_4digit": {"start": 2000, "end": 4000, "axis": "4digit"}}, "カンパチ": {"daiwa": {"start": 300, "end": 600, "axis": "3digit"}, "shimano_4digit": {"start": 1000, "end": 6000, "axis": "4digit"}}, "ゾイ": {"daiwa": {"start": 300, "end": 500, "axis": "3digit"}}, "タラ": {"daiwa": {"start": 300, "end": 500, "axis": "3digit"}}, "ムツ": {"daiwa": {"start": 300, "end": 500, "axis": "3digit"}, "shimano_3digit": {"start": 600, "end": 600, "axis": "3digit"}, "shimano_4digit": {"start": 2000, "end": 4000, "axis": "4digit"}}, "サケ・マス": {"daiwa": {"start": 300, "end": 500, "axis": "3digit"}}, "サバ": {"daiwa": {"start": 400, "end": 400, "axis": "3digit"}, "shimano_3digit": {"start": 600, "end": 600, "axis": "3digit"}, "shimano_4digit": {"start": 3000, "end": 3000, "axis": "4digit"}}, "カツオ": {"daiwa": {"start": 500, "end": 500, "axis": "3digit"}}, "カサゴ": {"daiwa": {"start": 500, "end": 500, "axis": "3digit"}}, "オニカサゴ": {"daiwa": {"start": 500, "end": 500, "axis": "3digit"}}, "キンメダイ": {"daiwa": {"start": 500, "end": 500, "axis": "3digit"}, "shimano_4digit": {"start": 4000, "end": 4000, "axis": "4digit"}}, "メダイ": {"daiwa": {"start": 500, "end": 500, "axis": "3digit"}, "shimano_4digit": {"start": 4000, "end": 4000, "axis": "4digit"}}, "イワシ": {"daiwa": {"start": 500, "end": 500, "axis": "3digit"}, "shimano_4digit": {"start": 3000, "end": 3000, "axis": "4digit"}}};

// ===== 軸定義 =====
// 3桁軸: DAIWA / SHIMANO 3桁
const TICKS_3 = [100, 200, 300, 400, 500, 600];
// 4桁軸: SHIMANO 4桁
const TICKS_4 = [1000, 2000, 3000, 4000, 6000];

function makeAxis(ticks) {
  const n = ticks.length;
  const w = 100 / n;
  return {
    ticks,
    pctLeft:  b => ticks.indexOf(b) * w,
    pctWidth: (s, e) => (ticks.indexOf(e) - ticks.indexOf(s) + 1) * w,
    has: b => ticks.includes(b),
    tickW: w,
  };
}
const AXIS_3 = makeAxis(TICKS_3);
const AXIS_4 = makeAxis(TICKS_4);

// ===== ブランド行定義 =====
const BRAND_ROWS = [
  { label: 'DAIWA',           cls: 'seg-daiwa',          axis: AXIS_3, active: [100,200,300,400,500,600] },
  { label: 'SHIMANO\n3桁',    cls: 'seg-shimano-3digit', axis: AXIS_3, active: [200,300,600] },
  { label: 'SHIMANO\n4桁',    cls: 'seg-shimano-4digit', axis: AXIS_4, active: [1000,2000,3000,4000,6000] },
];

// ===== 魚種行: key→軸・色のマッピング =====
const FISH_TRACK_DEFS = [
  { key: 'daiwa',          cls: 'fish-bar-daiwa',          axis: AXIS_3 },
  { key: 'shimano_3digit', cls: 'fish-bar-shimano-3digit', axis: AXIS_3 },
  { key: 'shimano_4digit', cls: 'fish-bar-shimano-4digit', axis: AXIS_4 },
];

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

const chart = document.getElementById('chart');

// ===== ブランド行描画 =====
for (const brand of BRAND_ROWS) {
  const row = el('div', 'brand-row');
  const lbl = el('div', 'brand-label');
  lbl.innerHTML = brand.label.replace('\n', '<br>');
  row.appendChild(lbl);

  const wrap = el('div', 'track-wrap');
  wrap.appendChild(el('div', 'track-bg'));

  const { ticks, pctLeft, pctWidth, tickW } = brand.axis;
  const activeSet = new Set(brand.active);

  let segStart = null;
  for (let i = 0; i <= ticks.length; i++) {
    const b = ticks[i];
    const on = b !== undefined && activeSet.has(b);
    if (on && segStart === null) segStart = b;
    if (!on && segStart !== null) {
      const endBand = ticks[i - 1];
      const left  = pctLeft(segStart);
      const width = pctWidth(segStart, endBand);
      const fill = el('div', `seg-fill ${brand.cls}`);
      fill.style.left = left + '%';
      fill.style.width = width + '%';
      const rL = left < 0.1 ? '5px' : '0';
      const rR = left + width > 99.9 ? '5px' : '0';
      fill.style.borderRadius = `${rL} ${rR} ${rR} ${rL}`;
      wrap.appendChild(fill);

      for (let j = ticks.indexOf(segStart); j <= ticks.indexOf(endBand); j++) {
        const t = el('div', 'tick-label');
        t.style.left  = (j * tickW) + '%';
        t.style.width = tickW + '%';
        t.textContent = ticks[j];
        wrap.appendChild(t);
      }
      segStart = null;
    }
  }

  row.appendChild(wrap);
  chart.appendChild(row);
}

chart.appendChild(el('div', 'section-gap'));

// ===== 魚種行描画 =====
// 全魚種を RANGES のキーから取得（重複なし）
const allFish = [...new Set(Object.keys(RANGES))].sort((a, b) => a.localeCompare(b, 'ja'));

for (const fish of allFish) {
  const fishData = RANGES[fish] || {};

  // 表示するトラックが1本もなければスキップ
  const hasSomething = FISH_TRACK_DEFS.some(d => {
    const r = fishData[d.key];
    return r && d.axis.has(r.start) && d.axis.has(r.end);
  });
  if (!hasSomething) continue;

  const row = el('div', 'fish-row');
  const lbl = el('div', 'fish-label');
  lbl.textContent = fish;
  row.appendChild(lbl);

  const tracks = el('div', 'fish-tracks');

  for (const def of FISH_TRACK_DEFS) {
    const r = fishData[def.key];
    const track = el('div', 'fish-track');
    if (r && def.axis.has(r.start) && def.axis.has(r.end)) {
      const bar = el('div', `fish-bar ${def.cls}`);
      bar.style.left  = def.axis.pctLeft(r.start) + '%';
      bar.style.width = def.axis.pctWidth(r.start, r.end) + '%';
      track.appendChild(bar);
    }
    tracks.appendChild(track);
  }

  row.appendChild(tracks);
  chart.appendChild(row);
}
</script>
</body>
</html>
